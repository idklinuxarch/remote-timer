<!DOCTYPE html>
<html>
<head>
    <title>Overlay</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 120px;
            color: white;
            font-family: Arial;
        }
    </style>
</head>
<body>

<div id="timer">0</div>

<script>
async function update() {
    const res = await fetch("/api/state");
    const data = await res.json();

    document.getElementById("timer").innerText = data.seconds;
}

setInterval(update, 1000);
update();
</script>

</body>
</html>
